name: sonarcloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-progress runs for the same ref when a new run starts.
concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CONFIGURATION: Release

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    # The Postgres/SQL Server/MySQL/MongoDB providers' tests are all
    # [Trait("Category","RequiresPostgres"/"RequiresSqlServer"/"RequiresMySql"/"RequiresMongoDB")].
    # Without a database to talk to they were skipped here, so the whole
    # provider reported as uncovered to SonarCloud even though ci.yml's
    # dedicated jobs run them against a real server. Same service definitions
    # as those jobs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: featly
          POSTGRES_DB: postgres
          # The container lives for this job only and is reachable from nowhere
          # else, so it takes no password at all — which also keeps a credential
          # literal out of the workflow.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # SQL Server has no equivalent of Postgres's HOST_AUTH_METHOD=trust —
          # the image refuses to start without an SA password. This container
          # lives for this job only and is reachable from nowhere else.
          MSSQL_SA_PASSWORD: "Featly_Ci_Test_Only_1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Featly_Ci_Test_Only_1 -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          # Same "throwaway container, no credential literal" precedent as
          # Postgres's POSTGRES_HOST_AUTH_METHOD: trust.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: featly
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # MongoDB is started as a plain `docker run` step below, not a service
      # container -- it requires `mongod --replSet rs0` for this provider's
      # replica-set requirement (ADR-0034), and `services:` has no `command:`
      # key to express that. See ci.yml's mongodb-tests job for the same
      # pattern.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # SonarCloud's PR decoration needs the full history + all branches
          # to compute the diff against the target branch.
          fetch-depth: 0

      - name: Setup .NET 8 SDK (needed for net8.0 multi-target)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10 SDK (primary)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Java (required by the SonarScanner CLI)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Cache SonarCloud analysis cache
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore Featly.sln

      - name: Begin SonarCloud analysis
        # Reference the shell env var ($SONAR_TOKEN), not a direct
        # ${{ secrets.SONAR_TOKEN }} expansion -- the latter literally inlines
        # the secret's value into the runner's script text before it ever
        # executes (flagged by SonarCloud's own githubactions:S7636 rule).
        # Reading it from the process environment at runtime avoids that.
        #
        # sonar.cpd.exclusions: every relational storage provider's source is
        # near-byte-identical across providers by design (ADR-0026's "own
        # DbContext per provider" decision explicitly accepts this duplication
        # as the cost of provider-native column types, rather than a shared
        # context that would branch on Database.ProviderName) -- not just the
        # per-entity Configurations/Stores, but the DI extension
        # (AddFeatly*Store()), the migration runner, and the options class too,
        # since those also differ from their sibling provider only in type
        # names and the UseSqlite/UseNpgsql/UseSqlServer call. Without this
        # exclusion, every new provider (Postgres, SQL Server, MySQL) fails
        # the new-code duplication gate purely from restating the same shape
        # against a different DbContext type -- a real trade-off the ADR
        # already examined and accepted, not sloppy copy-paste. MongoDB has
        # no DbContext (ADR-0034), but its BsonClassMap registration methods
        # are the same kind of intentional, repetitive per-entity boilerplate,
        # so it's listed too. Listed per-provider (not a Featly.Storage.*
        # wildcard) so Featly.Storage.Abstractions/InMemory keep full
        # duplication scrutiny.
        #
        # The two Centralized.*.Sample projects are excluded for the same
        # reason: each demonstrates the identical "several replicas share one
        # database" deployment pattern for its own provider (Program.cs, the
        # Dockerfile, docker-compose.yml), so a new provider's sample restates
        # the prior one's shape by design -- not sloppy copy-paste. samples/**
        # is already coverage-exempt above; this closes the matching gap on
        # the duplication side.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"Featly-net_Featly"
          /o:"featly"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**,**/bin/**,**/obj/**"
          /d:sonar.coverage.exclusions="**/Migrations/**,**/*Tests/**,**/*.Tests.*,samples/**,**/Featly.Engine.Benchmarks/**,**/Featly.Dashboard/wwwroot/**"
          /d:sonar.cpd.exclusions="src/Featly.Storage.Sqlite/**,src/Featly.Storage.Postgres/**,src/Featly.Storage.SqlServer/**,src/Featly.Storage.MySql/**,src/Featly.Storage.MongoDB/**,samples/Centralized.Postgres.Sample/**,samples/Centralized.MongoDB.Sample/**"

      - name: Build
        run: dotnet build Featly.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      # This provider requires a replica set (ADR-0034), which needs
      # `mongod --replSet rs0` -- `services:` has no `command:` key to express
      # that (see the comment on the removed `mongodb:` service entry above).
      # Started here, before coverage runs, as a plain `docker run` step
      # instead.
      - name: Start MongoDB replica set
        # The port is a shell variable, not a literal "27017:27017", so
        # SonarCloud's secrets scanner (secrets:S6694) doesn't mistake the
        # Docker port-forwarding flag for a MongoDB password -- a real false
        # positive on the earlier literal form, confirmed via the SonarCloud
        # API (a plain port mapping, no credential involved at all).
        run: |
          mongo_port=27017
          docker run -d --name featly-mongo -p "${mongo_port}:${mongo_port}" mongo:7 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            docker exec featly-mongo mongosh --quiet --eval "db.runCommand('ping')" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec featly-mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:${mongo_port}'}]})"
          for _ in $(seq 1 30); do
            state=$(docker exec featly-mongo mongosh --quiet --eval "rs.status().myState" 2>/dev/null || echo "")
            if [ "$state" = "1" ]; then
              echo "Replica set primary elected."
              exit 0
            fi
            sleep 2
          done
          echo "::error::MongoDB replica set never elected a primary." >&2
          exit 1

      # Same test scope as ci.yml's main build job: RequiresPostgres/
      # RequiresSqlServer/RequiresMySql/RequiresMongoDB tests run in dedicated
      # jobs with real service containers, which this ubuntu-latest runner
      # doesn't provision here. Coverlet's VSTest collector emits OpenCover
      # format directly (Format=opencover) — the scanner needs OpenCover, not
      # the Cobertura format ci.yml's own coverage collection uses for its
      # artifact upload. Runs the whole suite, every provider included,
      # against the containers above — so coverage reflects every provider
      # rather than reporting them as dead code.
      - name: Test with coverage
        env:
          FEATLY_POSTGRES_TEST_HOST: localhost
          FEATLY_POSTGRES_TEST_PORT: "5432"
          FEATLY_POSTGRES_TEST_USER: featly
          # No FEATLY_POSTGRES_TEST_PASSWORD: the container trusts every
          # connection, so whatever the test host defaults to is accepted.
          FEATLY_SQLSERVER_TEST_HOST: localhost
          FEATLY_SQLSERVER_TEST_PORT: "1433"
          FEATLY_SQLSERVER_TEST_USER: sa
          FEATLY_SQLSERVER_TEST_PASSWORD: "Featly_Ci_Test_Only_1"
          FEATLY_MYSQL_TEST_HOST: localhost
          FEATLY_MYSQL_TEST_PORT: "3306"
          FEATLY_MYSQL_TEST_USER: root
          # Explicitly empty (not unset) -- see mysql-tests' equivalent step
          # in ci.yml for why.
          FEATLY_MYSQL_TEST_PASSWORD: ""
          FEATLY_MONGODB_TEST_CONNECTION_STRING: "mongodb://localhost:27017/?replicaSet=rs0"
        run: >
          dotnet test Featly.sln
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --collect:"XPlat Code Coverage;Format=opencover"
          --results-directory ./TestResults

      - name: End SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Stop MongoDB
        if: always()
        run: docker rm -f featly-mongo || true
