name: sonarcloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-progress runs for the same ref when a new run starts.
concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CONFIGURATION: Release

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    # The Postgres/SQL Server providers' tests are all
    # [Trait("Category","RequiresPostgres"/"RequiresSqlServer")]. Without a
    # database to talk to they were skipped here, so the whole provider
    # reported as uncovered to SonarCloud even though ci.yml's dedicated jobs
    # run them against a real server. Same service definitions as those jobs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: featly
          POSTGRES_DB: postgres
          # The container lives for this job only and is reachable from nowhere
          # else, so it takes no password at all — which also keeps a credential
          # literal out of the workflow.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # SQL Server has no equivalent of Postgres's HOST_AUTH_METHOD=trust —
          # the image refuses to start without an SA password. This container
          # lives for this job only and is reachable from nowhere else.
          MSSQL_SA_PASSWORD: "Featly_Ci_Test_Only_1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Featly_Ci_Test_Only_1 -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # SonarCloud's PR decoration needs the full history + all branches
          # to compute the diff against the target branch.
          fetch-depth: 0

      - name: Setup .NET 8 SDK (needed for net8.0 multi-target)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10 SDK (primary)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Java (required by the SonarScanner CLI)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Cache SonarCloud analysis cache
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore Featly.sln

      - name: Begin SonarCloud analysis
        # Reference the shell env var ($SONAR_TOKEN), not a direct
        # ${{ secrets.SONAR_TOKEN }} expansion -- the latter literally inlines
        # the secret's value into the runner's script text before it ever
        # executes (flagged by SonarCloud's own githubactions:S7636 rule).
        # Reading it from the process environment at runtime avoids that.
        #
        # sonar.cpd.exclusions: each relational storage provider's
        # Configurations/ and Stores/ files are near-byte-identical across
        # providers by design (ADR-0026's "own DbContext per provider" decision
        # explicitly accepts this duplication as the cost of provider-native
        # column types, rather than a shared context that would branch on
        # Database.ProviderName). Without this exclusion, every new provider
        # (Postgres, SQL Server, and future MySQL/MongoDB) fails the new-code
        # duplication gate purely from restating the same store bodies against
        # a different DbContext type -- a real trade-off the ADR already
        # examined and accepted, not sloppy copy-paste.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"Featly-net_Featly"
          /o:"featly"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**,**/bin/**,**/obj/**"
          /d:sonar.coverage.exclusions="**/Migrations/**,**/*Tests/**,**/*.Tests.*,samples/**,**/Featly.Engine.Benchmarks/**,**/Featly.Dashboard/wwwroot/**"
          /d:sonar.cpd.exclusions="src/Featly.Storage.*/Configurations/**,src/Featly.Storage.*/Stores/**"

      - name: Build
        run: dotnet build Featly.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      # Same test scope as ci.yml's main build job: RequiresPostgres/
      # RequiresSqlServer tests run in dedicated jobs with real service
      # containers, which this ubuntu-latest runner doesn't provision here.
      # Coverlet's VSTest collector emits OpenCover format directly
      # (Format=opencover) — the scanner needs OpenCover, not the Cobertura
      # format ci.yml's own coverage collection uses for its artifact upload.
      # Runs the whole suite, Postgres and SQL Server providers included,
      # against the service containers above — so coverage reflects every
      # provider rather than reporting them as dead code.
      - name: Test with coverage
        env:
          FEATLY_POSTGRES_TEST_HOST: localhost
          FEATLY_POSTGRES_TEST_PORT: "5432"
          FEATLY_POSTGRES_TEST_USER: featly
          # No FEATLY_POSTGRES_TEST_PASSWORD: the container trusts every
          # connection, so whatever the test host defaults to is accepted.
          FEATLY_SQLSERVER_TEST_HOST: localhost
          FEATLY_SQLSERVER_TEST_PORT: "1433"
          FEATLY_SQLSERVER_TEST_USER: sa
          FEATLY_SQLSERVER_TEST_PASSWORD: "Featly_Ci_Test_Only_1"
        run: >
          dotnet test Featly.sln
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --collect:"XPlat Code Coverage;Format=opencover"
          --results-directory ./TestResults

      - name: End SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
