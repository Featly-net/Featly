name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-progress runs for the same ref when a new run starts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CONFIGURATION: Release

jobs:
  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK (needed for net8.0 multi-target)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10 SDK (primary)
        uses: actions/setup-dotnet@v5
        with:
          # global.json pins 10.0.300; setup-dotnet honors the file when present.
          global-json-file: global.json

      - name: Show installed SDKs
        run: dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Featly.sln

      # Run format check on Linux only: the policy is OS-agnostic and running
      # it twice just wastes minutes. The macOS/Windows path would also flag
      # spurious CRLF issues if .gitattributes ever misbehaves.
      #
      # `--severity warn` blocks the build on warnings/errors but lets info-level
      # suggestions (IDE1006 naming hints, IDE0290 primary-constructor refactors,
      # etc.) surface as advice without failing CI. Cleanup of those is tracked
      # separately and can be done in dedicated style PRs.
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Featly.sln --verify-no-changes --no-restore --severity warn

      - name: Build
        run: dotnet build Featly.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      # RequiresPostgres/RequiresSqlServer/RequiresMySql/RequiresMongoDB tests
      # need a real database reachable, which the GitHub-hosted Windows runner
      # can't provide (Actions service containers are Linux-only) — they run
      # in the dedicated postgres-tests/sqlserver-tests/mysql-tests/
      # mongodb-tests jobs below instead, against real service containers on
      # ubuntu-latest.
      - name: Test
        run: >
          dotnet test Featly.sln
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --filter "Category!=RequiresPostgres&Category!=RequiresSqlServer&Category!=RequiresMySql&Category!=RequiresMongoDB"
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*
          if-no-files-found: warn
          retention-days: 14

  postgres-tests:
    name: postgres provider tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: featly
          POSTGRES_PASSWORD: featly
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/Featly.Storage.Postgres.Tests/Featly.Storage.Postgres.Tests.csproj

      - name: Test
        env:
          FEATLY_POSTGRES_TEST_HOST: localhost
          FEATLY_POSTGRES_TEST_PORT: "5432"
          FEATLY_POSTGRES_TEST_USER: featly
          FEATLY_POSTGRES_TEST_PASSWORD: featly
        run: >
          dotnet test tests/Featly.Storage.Postgres.Tests/Featly.Storage.Postgres.Tests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-postgres
          path: TestResults/**/*
          if-no-files-found: warn
          retention-days: 14

  sqlserver-tests:
    name: sqlserver provider tests
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # SQL Server has no equivalent of Postgres's HOST_AUTH_METHOD=trust —
          # the image refuses to start without an SA password. This container
          # lives for this job only and is reachable from nowhere else.
          MSSQL_SA_PASSWORD: "Featly_Ci_Test_Only_1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Featly_Ci_Test_Only_1 -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/Featly.Storage.SqlServer.Tests/Featly.Storage.SqlServer.Tests.csproj

      - name: Test
        env:
          FEATLY_SQLSERVER_TEST_HOST: localhost
          FEATLY_SQLSERVER_TEST_PORT: "1433"
          FEATLY_SQLSERVER_TEST_USER: sa
          FEATLY_SQLSERVER_TEST_PASSWORD: "Featly_Ci_Test_Only_1"
        run: >
          dotnet test tests/Featly.Storage.SqlServer.Tests/Featly.Storage.SqlServer.Tests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-sqlserver
          path: TestResults/**/*
          if-no-files-found: warn
          retention-days: 14

  mysql-tests:
    name: mysql provider tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          # The container lives for this job only and is reachable from
          # nowhere else, so it takes no root password at all -- same
          # "throwaway container, no credential literal" precedent as
          # Postgres's POSTGRES_HOST_AUTH_METHOD: trust.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: featly
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/Featly.Storage.MySql.Tests/Featly.Storage.MySql.Tests.csproj

      - name: Test
        env:
          FEATLY_MYSQL_TEST_HOST: localhost
          FEATLY_MYSQL_TEST_PORT: "3306"
          FEATLY_MYSQL_TEST_USER: root
          # Explicitly empty (not unset): MySqlTestHost falls back to a
          # non-empty local-dev default when this variable is unset, which
          # would be wrong for this container -- MYSQL_ALLOW_EMPTY_PASSWORD
          # above means it only accepts an empty password for root.
          FEATLY_MYSQL_TEST_PASSWORD: ""
        run: >
          dotnet test tests/Featly.Storage.MySql.Tests/Featly.Storage.MySql.Tests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-mysql
          path: TestResults/**/*
          if-no-files-found: warn
          retention-days: 14

  mongodb-tests:
    name: mongodb provider tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # This provider requires a replica set (ADR-0034), which needs
      # `mongod --replSet rs0` — GitHub Actions' `services:` block has no
      # `command:` key to express that (every other provider's service entry
      # only needs env vars/health checks, which `services:` does support).
      # Run and initiate it as a plain `docker run` job step instead of a
      # service container.
      - name: Start MongoDB replica set
        # The port is a shell variable, not a literal "27017:27017", so
        # SonarCloud's secrets scanner (secrets:S6694) doesn't mistake the
        # Docker port-forwarding flag for a MongoDB password -- a real false
        # positive on the earlier literal form, confirmed via the SonarCloud
        # API (a plain port mapping, no credential involved at all).
        run: |
          mongo_port=27017
          docker run -d --name featly-mongo -p "${mongo_port}:${mongo_port}" mongo:7 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            docker exec featly-mongo mongosh --quiet --eval "db.runCommand('ping')" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec featly-mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:${mongo_port}'}]})"
          for _ in $(seq 1 30); do
            state=$(docker exec featly-mongo mongosh --quiet --eval "rs.status().myState" 2>/dev/null || echo "")
            if [ "$state" = "1" ]; then
              echo "Replica set primary elected."
              exit 0
            fi
            sleep 2
          done
          echo "::error::MongoDB replica set never elected a primary." >&2
          exit 1

      - name: Restore
        run: dotnet restore tests/Featly.Storage.MongoDB.Tests/Featly.Storage.MongoDB.Tests.csproj

      - name: Test
        env:
          FEATLY_MONGODB_TEST_CONNECTION_STRING: "mongodb://localhost:27017/?replicaSet=rs0"
        run: >
          dotnet test tests/Featly.Storage.MongoDB.Tests/Featly.Storage.MongoDB.Tests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-mongodb
          path: TestResults/**/*
          if-no-files-found: warn
          retention-days: 14

      - name: Stop MongoDB
        if: always()
        run: docker rm -f featly-mongo || true

  pack:
    name: pack (preview)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Featly.sln

      - name: Pack
        run: >
          dotnet pack Featly.sln
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          --output ./artifacts
          -p:ContinuousIntegrationBuild=true

      - name: Upload nupkgs
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: artifacts/*.*nupkg
          if-no-files-found: error
          retention-days: 14
