# Round-robins across both Featly replicas so you can see cross-replica push
# working: open two browser tabs against http://localhost:5089/featly, flip a
# flag in one, and watch the change land in the other via SSE — even though
# nginx may have routed the two tabs to different replicas.
events {}

http {
    upstream featly_replicas {
        server featly-a:8080;
        server featly-b:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://featly_replicas;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # SSE (the dashboard's live-update stream) needs buffering off and
            # a long read timeout, or nginx will chunk/close the stream.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }
}
